<!DOCTYPE html>
<html lang="zh-CN" data-theme="biren-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f1f5f9" />
  <link rel="icon" href="assets/favicon.ico" />
  <title>壁仞科技 · CEO 决策看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="preview-shell" id="previewShell">
    <div class="preview-toolbar" aria-hidden="true">
      <span class="preview-label">PC 预览 · 390×844 移动端</span>
      <button type="button" class="preview-toggle" id="fullscreenToggle">全屏预览</button>
    </div>
    <div class="device-frame">
      <div class="device-notch"></div>
      <div class="app" id="app">
        <!-- Status bar -->
        <header class="top-bar" id="topBar">
          <div class="top-bar__row">
            <div class="brand">
              <div class="brand__mark" aria-hidden="true">
                <img class="brand__logo" src="assets/biren-mark.svg" alt="" width="28" height="24" />
              </div>
              <div>
                <div class="brand__name">壁仞科技</div>
                <div class="brand__sub">CEO 决策看板</div>
              </div>
            </div>
            <div class="top-bar__actions">
              <button class="icon-btn theme-btn" id="themeBtn" aria-label="切换配色" title="切换壁仞主题色">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
              </button>
              <button class="icon-btn" id="settingsBtn" aria-label="偏好设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              </button>
            </div>
          </div>
        </header>

        <main class="main-scroll" id="mainScroll">
          <!-- HOME：今日关注（外部→内部）→ 经营脉搏 → 待办 -->
          <section class="tab-panel is-active" data-tab="home" id="panelHome">
            <section class="section section--decision" id="homeBriefSection">
              <div class="section__head">
                <h2>今日关注</h2>
                <button type="button" class="text-btn" id="intelEntryBtn">完整情报 ›</button>
              </div>
              <article class="focus-brief" id="decisionBriefCard"></article>
              <p class="intel-meta-line" id="intelEntryMeta">情报加载中…</p>
            </section>

            <section class="section section--ops" id="homeMetricsSection">
              <div class="section__head">
                <h2>经营脉搏</h2>
                <button type="button" class="text-btn" id="metricsMoreBtn">全部指标</button>
              </div>
              <p class="section__hint">指标均来自客户 IT 12 项</p>
              <div class="ops-pulse-grid" id="itQuickGrid"></div>
              <div class="ops-alert-row" id="snapshotsGrid"></div>
            </section>

            <section class="section section--action" id="actionSection">
              <div class="section__head">
                <h2>待办</h2>
                <button type="button" class="text-btn" id="todosMoreBtn">全部待办 ›</button>
              </div>
              <div id="todoList" class="todo-list"></div>
            </section>
          </section>

          <!-- INTEL TAB：完整情报 -->
          <section class="tab-panel" data-tab="intel" id="panelIntel">
            <div class="intel-refresh-bar" id="intelRefreshBar">
              <div class="intel-refresh-bar__row">
                <div class="intel-refresh-bar__meta">
                  <span class="intel-refresh-bar__label" id="intelLastUpdated">情报包加载中…</span>
                </div>
                <button type="button" class="btn btn--outline btn--sm intel-refresh-btn" id="intelRefreshBtn" aria-label="刷新最新消息">
                  <svg class="intel-refresh-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/>
                  </svg>
                  <span>刷新</span>
                </button>
              </div>
              <div class="intel-refresh-progress hidden" id="intelRefreshProgress" role="status" aria-live="polite">
                <div class="intel-refresh-progress__track">
                  <div class="intel-refresh-progress__fill" id="intelRefreshProgressFill"></div>
                </div>
                <p class="intel-refresh-progress__text" id="intelRefreshProgressText"></p>
              </div>
              <div class="intel-reload-banner hidden" id="intelReloadBanner">
                <div class="intel-reload-banner__text">
                  <strong>情报已更新</strong>
                  <span id="intelReloadBannerMeta">请手动刷新页面以锁定最新内容</span>
                </div>
                <button type="button" class="btn btn--primary btn--sm" id="intelReloadPageBtn">刷新页面</button>
              </div>
            </div>
            <div class="filter-chips" id="topicFilters"></div>
            <div class="intel-feed" id="intelFeed"></div>
          </section>

          <!-- TASKS TAB -->
          <section class="tab-panel" data-tab="tasks" id="panelTasks">
            <div class="tasks-summary" id="tasksSummary"></div>
            <section class="todo-calendar" id="todoCalendar" aria-label="待办日历"></section>
            <div class="todo-groups" id="todoGroups"></div>
            <button class="btn btn--outline btn--block" id="newTodoBtn" style="margin:12px 0 10px">+ 新建待办</button>
            <div class="todo-list todo-list--full" id="tasksFullList"></div>
          </section>

          <!-- ME TAB -->
          <section class="tab-panel" data-tab="me" id="panelMe">
            <div class="profile-card">
              <div class="profile-card__avatar" aria-hidden="true">
                <img class="profile-card__logo" src="assets/biren-mark.svg" alt="" width="28" height="24" />
              </div>
              <div>
                <div class="profile-card__name">CEO 视图</div>
                <div class="profile-card__desc">今日关注 · 经营脉搏 · 待办闭环</div>
              </div>
            </div>
            <div class="settings-list" id="settingsList"></div>
          </section>
        </main>

        <!-- 指标池二级页 -->
        <section class="subpage hidden" id="subpageMetricsPool" aria-label="公司核心指标池">
          <header class="subpage-header">
            <button type="button" class="subpage-back" id="poolBackBtn" aria-label="返回">←</button>
            <div class="subpage-header__text">
              <h1 class="subpage-header__title">公司核心指标池</h1>
              <p class="subpage-header__sub">客户 IT 指标 · 共 <span id="poolTotalCount">0</span> 项</p>
            </div>
          </header>
          <div class="subpage-body">
            <p class="pool-tip">★ 可置顶最多 3 项 CEO 核心指标；指标库为客户 IT 12 项</p>
            <div class="pool-summary" id="poolSummary"></div>
            <div class="filter-chips" id="poolDomainFilters"></div>
            <div class="pool-sections" id="poolMetricList"></div>
          </div>
        </section>

        <nav class="bottom-nav" aria-label="主导航">
          <button class="bottom-nav__item is-active" data-nav="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
            <span>首页</span>
          </button>
          <button class="bottom-nav__item" data-nav="intel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
            <span>情报</span>
          </button>
          <button class="bottom-nav__item" data-nav="tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            <span>待办</span>
            <em class="bottom-nav__dot" id="navTodoDot"></em>
          </button>
          <button class="bottom-nav__item" data-nav="me">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
            <span>我的</span>
          </button>
        </nav>
      </div>
    </div>
  </div>

  <!-- Detail sheet -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <div class="sheet hidden" id="detailSheet" role="dialog" aria-modal="true">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h3 id="sheetTitle">详情</h3>
      <button class="icon-btn sheet__close" id="sheetClose" aria-label="关闭">✕</button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
    <div class="sheet__footer" id="sheetFooter"></div>
  </div>

  <!-- WeCom dispatch modal -->
  <div class="modal-backdrop hidden" id="dispatchBackdrop"></div>
  <div class="modal hidden" id="dispatchModal" role="dialog" aria-modal="true">
    <div class="modal__head">
      <h3>下发至企微</h3>
      <button class="icon-btn" id="dispatchClose">✕</button>
    </div>
    <div class="modal__body" id="dispatchBody"></div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="dispatchCancel">取消</button>
      <button class="btn btn--primary" id="dispatchConfirm">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        确认下发
      </button>
    </div>
  </div>

  <!-- New todo modal -->
  <div class="modal-backdrop hidden" id="todoBackdrop"></div>
  <div class="modal modal--tall hidden" id="todoModal" role="dialog" aria-modal="true">
    <div class="modal__head">
      <h3>新建待办</h3>
      <button class="icon-btn" id="todoModalClose">✕</button>
    </div>
    <div class="modal__body">
      <button class="voice-btn" id="voiceBtn" type="button">
        <span class="voice-btn__icon" id="voiceIcon">🎙</span>
        <span class="voice-btn__text" id="voiceLabel">按住说话 · 转写并摘要</span>
      </button>
      <label class="field-label">语音转写</label>
      <textarea class="field-input" id="voiceTranscript" rows="3" placeholder="点击上方按钮开始说话，或手动输入…"></textarea>
      <label class="field-label">AI 结构化摘要</label>
      <div class="summary-box" id="voiceSummary">摘要将在此自动生成：决策要点 / 跟进人 / 建议截止</div>
      <label class="field-label">待办标题</label>
      <input class="field-input" id="todoTitleInput" type="text" placeholder="可编辑 AI 生成的标题" />
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="todoModalCancel">取消</button>
      <button class="btn btn--primary" id="todoModalSave">保存待办</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="js/package-config.js"></script>
  <script src="js/dashboard-data.js"></script>
  <script src="js/app.js"></script>
  <!-- 客户反馈（独立服务 :8787，不影响主馆） -->
  <script
    src="http://120.55.184.234:8787/embed.js"
    data-demo-id="biren-ceo"
    data-api="http://120.55.184.234:8787"
    defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="biren-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f4f7fb" />
  <link rel="icon" href="assets/favicon.ico" />
  <title>壁仞科技 · 经营简报</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="preview-shell" id="previewShell">
    <div class="preview-toolbar">
      <span>PC 预览 · 经营简报</span>
      <button type="button" class="preview-toggle" id="fullscreenToggle">全屏</button>
    </div>
    <div class="device-frame">
      <div class="device-notch"></div>
      <div class="app" id="app">
        <header class="top-bar">
          <div class="brand">
            <img class="brand__logo" src="assets/biren-mark.svg" alt="" width="28" height="24" />
            <div>
              <div class="brand__name">壁仞科技</div>
              <div class="brand__sub">经营简报</div>
            </div>
          </div>
          <div class="top-bar__right">
            <div class="live-chip" id="liveMeta">情报 · —</div>
            <button type="button" class="icon-btn" id="btnRefresh" aria-label="刷新情报" title="刷新外部情报">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-2.6-6.2"/><path d="M21 3v6h-6"/></svg>
            </button>
          </div>
        </header>

        <main class="main-scroll" id="panelRoot"></main>

        <nav class="tab-nav" aria-label="主导航">
          <button type="button" class="tab-nav__btn is-active" data-panel="home">
            <span class="tab-nav__ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
            </span>
            <span class="tab-nav__label">今日</span>
          </button>
          <button type="button" class="tab-nav__btn" data-panel="decide">
            <span class="tab-nav__ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 11 14l4.5-5.5"/><circle cx="12" cy="12" r="9"/></svg>
            </span>
            <span class="tab-nav__label">拍板</span>
          </button>
          <button type="button" class="tab-nav__btn" data-panel="cash">
            <span class="tab-nav__ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 4.3 2.8 17.2A2 2 0 0 0 4.5 20h15a2 2 0 0 0 1.7-2.8L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>
            </span>
            <span class="tab-nav__label">阻塞</span>
          </button>
          <button type="button" class="tab-nav__btn" data-panel="promise">
            <span class="tab-nav__ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4.2 6h.01"/><path d="M4.2 12h.01"/><path d="M4.2 18h.01"/><circle cx="4.2" cy="6" r="1.15" fill="currentColor" stroke="none"/><circle cx="4.2" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="4.2" cy="18" r="1.15" fill="currentColor" stroke="none"/></svg>
            </span>
            <span class="tab-nav__label">事项</span>
          </button>
          <button type="button" class="tab-nav__btn" data-panel="intel">
            <span class="tab-nav__ico" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/><path d="M4.9 4.9a10 10 0 0 0 0 14.2"/></svg>
            </span>
            <span class="tab-nav__label">情报</span>
          </button>
        </nav>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <div class="sheet hidden" id="detailSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <h3 id="sheetTitle">情报详情</h3>
      <button type="button" class="icon-btn sheet__close" id="sheetClose" aria-label="关闭">✕</button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
    <div class="sheet__footer" id="sheetFooter"></div>
  </div>

  <script src="js/dashboard-data.js"></script>
  <script src="js/app.js"></script>
  <!-- 客户反馈（独立服务 :8787）V2 经营闭环 -->
  <script
    src="http://120.55.184.234:8787/embed.js"
    data-demo-id="biren-ops-loop"
    data-api="http://120.55.184.234:8787"
    defer></script>
</body>
</html>
